<style>
    :root{
      --bg:#000; --fg:#e6e6e6; --muted:#a8a8a8; --card:#111; --border:#555;
    }
    
    html{ overflow-y: scroll; scrollbar-gutter: stable; }
html,body{
      margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
      line-height:1.55;
    }
    a{color:#d9d9d9;text-decoration:none}
    a:hover{text-decoration:none}
    .container{max-width:1100px;margin:0 auto;padding:0 16px;}

    /* Верхняя часть: делаем её чуть компактнее */
    header{ padding:16px 0 0; }

    /* Main navigation */
    .main-menu{
      display:flex; flex-direction:column; align-items:center;
      gap:12px; margin:16px 0 0; padding:0;
    }
    
    .main-menu a{
      display:inline-block;
      width:180px;
      padding:11px 0;
      text-align:center;

      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
      font-size:16px;
      font-weight:500;
      line-height:1.2;
      letter-spacing:.2px;

      border:1px solid var(--border);
      border-radius:14px;
      color:#e0e0e0;
      background-color:#111;

      transition:all .25s ease;
      box-shadow:0 3px 6px rgba(255,255,255,0.06);
      text-decoration:none;
    }

    
    .main-menu a:hover{
      background-color:#1b1b1b;
      transform:translateY(-1px);
      box-shadow:0 6px 12px rgba(255,255,255,0.08);
    }


    /* Hero — поднимаем выше и без медиазапросов */
    .hero{
      margin:56px auto 32px; /* top | left/right | bottom */
      max-width:900px;
      text-align:center;
      padding:20px;
      border-radius:16px;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid #1e1e1e;
    }

    .hero h1{
  font-weight:600;
  font-size:clamp(1.7rem, 3.2vw, 2rem);
  margin:0 0 8px;
}
    .hero p{
      margin:0; color:var(--muted);
    }

    footer{
      margin:16px 0 16px;
      color:#8a8a8a; font-size:.9rem; text-align:center;
    }
	footer small{
  display:block;
  white-space:nowrap;
  font-size:.85rem;
  opacity:.9;
}
.laurel{
  display:block;
  margin:24px auto 10px;

  height:52px;
  width:auto !important;     /* перебивает img{width:100%} */
  max-width:320px;           /* дополнительная страховка */

  opacity:.65;
}
.laurels-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  margin:24px auto 10px;
}

.laurels-row .laurel{
  height:48px;
  width:auto !important;
  max-width:160px;
  margin:0;
  opacity:.65;
}
	@media (min-width: 900px){
  .hero h1{
    white-space:nowrap;
	    }
}
footer small{
  display:block;
  font-size:clamp(.78rem, 1.2vw, .9rem);
}

/* navigation colors */

.main-menu a.menu-home { color:#9aa7b3; }
.main-menu a.menu-music { color:#c8a96b; }

.main-menu a.menu-films { color:#8fa3b8; }
